<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Sanman Yojana emblem">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d98a"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8801d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="45%" stop-color="#ffc94d"/>
      <stop offset="100%" stop-color="#e8892b"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3149"/>
      <stop offset="100%" stop-color="#101d2d"/>
    </linearGradient>
  </defs>

  <!-- medallion -->
  <circle cx="64" cy="64" r="62" fill="url(#deep)"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity=".85"/>
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#gold)" stroke-width=".7" opacity=".45"/>

  <!-- outer lotus petals -->
  <g fill="url(#gold)" opacity=".92">
    <path d="M64 96c-13-1-23-7-27.5-16 9.5-3.5 19.5-2 27.5 4z"/>
    <path d="M64 96c13-1 23-7 27.5-16-9.5-3.5-19.5-2-27.5 4z"/>
    <path d="M64 97c-9.5-2.5-16.5-8.5-19-16.5 8 -1.5 15 1.5 19 8z"/>
    <path d="M64 97c9.5-2.5 16.5-8.5 19-16.5-8-1.5-15 1.5-19 8z"/>
  </g>

  <!-- inner lotus cup / diya bowl -->
  <path d="M40 78c0 9 10.5 16 24 16s24-7 24-16c0-2.2-2-3.2-4.2-2.4C76.6 78 70.6 79 64 79s-12.6-1-19.8-3.4C42 74.8 40 75.8 40 78z" fill="url(#gold)"/>
  <path d="M45 79.5c5.9 1.8 12.1 2.7 19 2.7s13.1-.9 19-2.7c-1.9 5.6-9.6 9.6-19 9.6s-17.1-4-19-9.6z" fill="#0d1725" opacity=".28"/>

  <!-- flame -->
  <path d="M64 24c7.5 9.5 14 17.5 14 26.5C78 61.8 71.7 69 64 69s-14-7.2-14-18.5C50 41.5 56.5 33.5 64 24z" fill="url(#flame)"/>
  <path d="M64 40c3.8 5.4 6.6 9.4 6.6 14.4 0 5.4-3 9.1-6.6 9.1s-6.6-3.7-6.6-9.1C57.4 49.4 60.2 45.4 64 40z" fill="#fffaf0" opacity=".8"/>

  <!-- rising spark -->
  <circle cx="64" cy="17" r="2.6" fill="url(#gold)"/>

  <!-- side flourishes -->
  <g stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M26 62c-3.5-4-3.5-9 0-13"/>
    <path d="M102 62c3.5-4 3.5-9 0-13"/>
  </g>
</svg>
